name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ieptb-agentic-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Security regression
        run: pytest -q tests/test_security.py tests/test_api.py
      - name: Evaluation
        run: PYTHONPATH=. python evaluation/run.py
