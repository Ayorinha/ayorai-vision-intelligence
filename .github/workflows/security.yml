name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Static security scan
        run: bandit -q -r src ai_shield
      - name: Lint
        run: ruff check src ai_shield tests
      - name: Type check
        run: mypy ai_shield --ignore-missing-imports
      - name: Type check
        run: mypy ai_shield --ignore-missing-imports
      - name: Tests
        run: PYTHONPATH=. python -m pytest -q
