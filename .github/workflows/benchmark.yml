name: Shield Benchmark

on:
  push:
    paths:
      - "ai_shield/**"
      - "benchmarks/**"
      - "tests/test_shield_benchmark.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "ai_shield/**"
      - "benchmarks/**"
      - "tests/test_shield_benchmark.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run Shield benchmark
        run: PYTHONPATH=. python -m benchmarks.shield_benchmark
      - name: Run benchmark regression test
        run: PYTHONPATH=. python -m pytest -q tests/test_shield_benchmark.py
      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmark-results/shield-benchmark.md ]; then
            cat benchmark-results/shield-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayorai-shield-benchmark
          path: benchmark-results/
          if-no-files-found: error
