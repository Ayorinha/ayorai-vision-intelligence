name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src ai_shield tests
      - name: Type check
        run: mypy ai_shield --ignore-missing-imports
      - name: Tests with coverage
        run: PYTHONPATH=. python -m pytest -q --cov=src --cov=ai_shield --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - name: API import smoke test
        run: PYTHONPATH=. python -c "from src.api.main import app; print(app.title)"
