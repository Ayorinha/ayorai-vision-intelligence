[project]
name = "ayorai-vision-intelligence"
version = "2.0.0"
description = "Agentic computer vision platform with tracking, uncertainty routing, human review, local-first RAG, tool orchestration and RPA."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "opencv-python-headless>=4.10,<5",
  "ultralytics>=8.3,<9",
  "streamlit>=1.38,<2",
  "requests>=2.32,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9","ruff>=0.6,<1","httpx>=0.27,<1"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]
